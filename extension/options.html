<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Fast Agent Settings</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --border: #334155;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: var(--card);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 400px;
      border: 1px solid var(--border);
    }
    h2 {
      margin-top: 0;
      color: var(--accent);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--accent-hover);
    }
    .status {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #10b981;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>⚙️ API Settings</h2>
    <div class="form-group">
      <label for="provider">Provider (e.g. openai, anthropic)</label>
      <input type="text" id="provider" placeholder="openai" value="openai">
    </div>
    <div class="form-group">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-...">
    </div>
    <div class="form-group">
      <label for="model">Model Name</label>
      <input type="text" id="model" placeholder="gpt-4o" value="gpt-4o">
    </div>
    <div class="form-group">
      <label for="baseUrl">Base URL (optional)</label>
      <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1">
    </div>
    <button id="saveBtn">Save Configuration</button>
    <div id="status" class="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
