<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Fast Agent Settings</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #8b5cf6; /* neon purple */
      --accent-hover: #7c3aed;
      --accent-secondary: #06b6d4; /* cyan */
      --success: #10b981;
      --danger: #ef4444;
      --input-bg: rgba(0, 0, 0, 0.4);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      /* Animated Mesh Gradient Background */
      background: radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 50%),
                  radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.15), transparent 50%);
      animation: pulseBg 10s ease-in-out infinite alternate;
    }

    @keyframes pulseBg {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    .container {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.1);
      width: 100%;
      max-width: 500px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-secondary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      letter-spacing: -0.5px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: rgba(139, 92, 246, 0.2);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Forms */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text);
      box-sizing: border-box;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s;
    }

    select option {
      background: #18181b;
      color: var(--text);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    /* Fetch Models Button */
    .fetch-models-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: transparent;
      border: none;
      color: var(--accent-secondary);
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .fetch-models-btn:hover {
      text-decoration: underline;
    }

    /* Modal for Models */
    .models-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .models-modal.active {
      display: flex;
    }

    .models-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .models-header {
      padding: 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .models-header h3 { margin: 0; font-size: 16px; }

    .close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
    }

    .models-list {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .model-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
    }

    .model-item-name {
      font-size: 13px;
      font-family: monospace;
      word-break: break-all;
    }

    .copy-btn {
      background: rgba(139, 92, 246, 0.2);
      color: var(--accent);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: var(--accent);
      color: white;
    }

    /* Actions */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-test {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    .btn-test:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255,255,255,0.2);
    }

    .btn-save {
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      color: white;
    }

    .btn-save:hover {
      background: linear-gradient(135deg, var(--accent-hover), #0891b2);
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      transform: translateY(-1px);
    }

    .status-area {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .status-area.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-area.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .testing .spinner { display: block; }
    .testing .icon { display: none; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

  </style>
</head>
<body>

  <div class="container">
    <h2>⚙️ Connection Setup</h2>

    <div class="tabs">
      <button class="tab-btn active" data-tab="preset">Pre-configured</button>
      <button class="tab-btn" data-tab="custom">Custom Endpoint</button>
    </div>

    <!-- PRESET TAB -->
    <div id="preset-tab" class="tab-content active">
      <div class="form-group">
        <label for="providerSelect">Provider</label>
        <select id="providerSelect">
          <option value="openai">OpenAI (Paid)</option>
          <option value="gemini">Google AI Studio / Gemini (Free/Paid)</option>
          <option value="groq">Groq (Free/Fast)</option>
          <option value="openrouter">OpenRouter (Multiple Models)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="presetApiKey">API Key</label>
        <input type="password" id="presetApiKey" placeholder="Enter your API Key...">
      </div>

      <div class="form-group">
        <label for="modelSelect">Model</label>
        <button class="fetch-models-btn" id="fetchModelsBtnPreset">Fetch Models</button>
        <select id="modelSelect">
          <!-- Populated by JS -->
        </select>
        <div style="margin-top: 8px;">
          <input type="text" id="customModelName" placeholder="Or paste model ID here..." style="display:none; font-size: 13px; padding: 10px;">
        </div>
      </div>
    </div>

    <!-- CUSTOM TAB -->
    <div id="custom-tab" class="tab-content">
      <div class="form-group">
        <label for="customBaseUrl">Base URL (OpenAI Compatible)</label>
        <input type="text" id="customBaseUrl" placeholder="https://api.yourprovider.com/v1">
      </div>
      <div class="form-group">
        <label for="customApiKey">API Key</label>
        <input type="password" id="customApiKey" placeholder="sk-...">
      </div>
      <div class="form-group">
        <label for="customModel">Model Name</label>
        <button class="fetch-models-btn" id="fetchModelsBtnCustom">Fetch Models</button>
        <input type="text" id="customModel" placeholder="llama3-70b-8192">
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-test" id="testBtn">
        <span class="icon">🔌</span>
        <div class="spinner"></div>
        <span>Test Connection</span>
      </button>
      <button class="btn btn-save" id="saveBtn">💾 Save Config</button>
    </div>

    <div id="statusArea" class="status-area"></div>
  </div>

  <!-- Models Modal -->
  <div class="models-modal" id="modelsModal">
    <div class="models-content">
      <div class="models-header">
        <h3>Available Models</h3>
        <button class="close-modal" id="closeModalBtn">&times;</button>
      </div>
      <div class="models-list" id="modelsList">
        <div style="text-align: center; color: var(--text-muted); font-size: 13px;">Fetching...</div>
      </div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
