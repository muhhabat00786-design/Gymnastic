<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #38bdf8, #818cf8);
      --bot-bg: #1e293b;
      --user-bg: #3b82f6;
      --border: rgba(255, 255, 255, 0.1);
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    .header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      transition: color 0.2s;
    }

    .settings-btn:hover {
      color: var(--text);
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-bg);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message.system {
      align-self: center;
      background: transparent;
      color: #94a3b8;
      font-size: 12px;
      font-style: italic;
      padding: 4px 8px;
    }

    .input-area {
      padding: 16px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .input-box {
      flex: 1;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-box:focus {
      border-color: var(--accent);
    }

    .send-btn {
      background: var(--accent-grad);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .send-btn:hover {
      transform: scale(1.05);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      background-color: var(--bot-bg);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      gap: 4px;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">AI Fast Agent</h1>
    <button class="settings-btn" id="openSettings" title="Settings">⚙️</button>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="message bot">Hello! I am your ultra-fast AI assistant. I can navigate, click, type, and automate the browser for you. What would you like me to do?</div>
    <div class="typing-indicator" id="typingIndicator">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="input-area">
    <input type="text" class="input-box" id="userInput" placeholder="Ask me to do anything..." autocomplete="off">
    <button class="send-btn" id="sendBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
