version: '3.8'

services:
  ubuntu-desktop:
    build:
      context: .
      dockerfile: Dockerfile.custom
    container_name: ubuntu-desktop
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - ubuntu-desktop
    restart: unless-stopped
