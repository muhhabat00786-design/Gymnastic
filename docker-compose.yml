version: '3.8'

services:
  ubuntu-desktop:
    build:
      context: .
      dockerfile: Dockerfile.custom
    container_name: ubuntu-desktop
    restart: unless-stopped
    ports:
      - "3389:3389"
    environment:
      - RDP_USER=${RDP_USER:?RDP_USER environment variable must be set}
      - RDP_PASSWORD=${RDP_PASSWORD:?RDP_PASSWORD environment variable must be set}
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '4.0'
          memory: 8G
    volumes:
      - ./.data:/home/${RDP_USER}

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-entrypoint.sh:/docker-entrypoint.d/99-htpasswd.sh:ro
    environment:
      - RDP_USER=${RDP_USER}
      - RDP_PASSWORD=${RDP_PASSWORD}
    depends_on:
      - ubuntu-desktop
    restart: unless-stopped
